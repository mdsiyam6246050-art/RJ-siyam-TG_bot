
name: RJ SIYAM Telegram Bot - Code Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Telegram Bot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript Syntax
        shell: bash
        run: |
          set -e
          while IFS= read -r file; do
            echo "Checking: $file"
            node --check "$file"
          done < <(find . -type f -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*")

      - name: Validate JSON Files
        shell: bash
        run: |
          set -e
          while IFS= read -r file; do
            echo "Checking: $file"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"
          done < <(find . -type f -name "*.json" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*")

      - name: Check Required Files
        run: |
          test -f package.json
          test -f start.js
          test -f index.js
          test -f core/api.js
          test -f core/bot.js
          test -f handlers/commandHandler.js
          test -f handlers/messageHandler.js
          test -f loader/loadCommands.js
          test -d commands
          test -d events

      - name: Check Completed
        run: echo "RJ SIYAM Telegram Bot code checks completed."
